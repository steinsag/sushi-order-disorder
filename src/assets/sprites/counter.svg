  <!-- Counter front panel highlight / slats -->
  <line x1="24" y1="26" x2="24" y2="56" stroke="#451a03" stroke-width="1.5" />
  <line x1="48" y1="26" x2="48" y2="56" stroke="#451a03" stroke-width="1.5" />
  <line x1="72" y1="26" x2="72" y2="56" stroke="#451a03" stroke-width="1.5" />
  <!-- Counter top surface (2.5D top perspective) -->
  <polygon points="2,24 10,6 86,6 94,24" fill="#d97706" stroke="#451a03" stroke-width="2" />
  <polygon points="4,23 11,8 85,8 92,23" fill="#f59e0b" />
