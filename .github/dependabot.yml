version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "08:15"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
